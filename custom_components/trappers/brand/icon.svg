<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4C3E8E"/>
      <stop offset="1" stop-color="#2E2559"/>
    </linearGradient>
  </defs>

  <!-- Background: rounded square in a deep indigo. Deliberately nowhere near
       the green/teal palette Dutch cycling-benefit brands (Trappers, FiscFree)
       use, so this mark reads as related-but-unofficial: a third-party
       community integration, not their asset. Original artwork — a bike wheel
       whose hub is a points token — not a copy of anyone's logo. -->
  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#bg)"/>

  <!-- Rear wheel -->
  <circle cx="88" cy="164" r="42" fill="none" stroke="#F2EFFA" stroke-width="9"/>
  <circle cx="88" cy="164" r="6" fill="#F2EFFA"/>
  <g stroke="#F2EFFA" stroke-width="3" opacity="0.55">
    <path d="M88 126 V202 M50 164 H126 M61 137 L115 191 M115 137 L61 191"/>
  </g>

  <!-- Front wheel, drawn as a points token: the trapper you earn per ride -->
  <circle cx="182" cy="164" r="42" fill="#E9B44C" stroke="#C08E2E" stroke-width="6"/>
  <circle cx="182" cy="164" r="29" fill="none" stroke="#8A6318" stroke-width="4" opacity="0.55"/>
  <path d="M182 141 l6.6 13.4 14.8 2.2 -10.7 10.4 2.5 14.7 -13.2 -6.9 -13.2 6.9 2.5 -14.7 -10.7 -10.4 14.8 -2.2 Z"
        fill="#4C3E8E"/>

  <!-- Frame + bars + saddle, tying the two wheels together -->
  <g fill="none" stroke="#F2EFFA" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
    <path d="M88 164 L124 100 L166 100"/>
    <path d="M124 100 L142 164 L88 164"/>
    <path d="M142 164 L172 106"/>
  </g>
  <rect x="108" y="90" width="34" height="11" rx="5" fill="#F2EFFA" transform="rotate(-14 125 96)"/>
  <path d="M162 96 h22" stroke="#F2EFFA" stroke-width="10" stroke-linecap="round"/>
  <circle cx="142" cy="164" r="8" fill="#F2EFFA"/>
</svg>
